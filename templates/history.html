<!DOCTYPE html>
<html>
<head>
    <title>Scan History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

<div class="container mt-5">

    <h1>📜 Scan History</h1>

    <a href="/" class="btn btn-outline-light mb-3">Back to Dashboard</a>
<form method="GET" class="mb-3">
    <input type="text" name="q" value="{{ keyword }}" placeholder="Search query..."
           class="form-control">
</form>
<table class="table table-dark table-striped">
<tr>
    <th>Timestamp</th>
    <th>Query</th>
    <th>Type</th>
    <th>Records Found</th>
    <th>Risk</th>
    <th>Score</th>
</tr>

{% for h in history %}
<tr>
    <td>{{ h.timestamp }}</td>
    <td>{{ h.query }}</td>
    <td>{{ h.search_type }}</td>
    <td>{{ h.records_found }}</td>
    <td>{{ h.risk_level }}</td>
    <td>{{ h.risk_score }}</td>
</tr>
{% endfor %}
</table>

</div>

</body>
</html>
