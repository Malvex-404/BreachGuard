<!DOCTYPE html>
<html lang="en">
<head>
    <title>BreachGuard</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container-fluid">
    <div class="row">
<div class="col-lg-2 col-md-3 sidebar">
    <h3>BreachGuard</h3>

    {% if session.get("user_id") %}
        <!-- Logged-in User Navigation -->
        <a href="/dashboard">📊 Dashboard</a>
        <a href="{{ url_for('analytics') }}">📊 Analytics</a>
        <a href="{{ url_for('notifications') }}">🔔 Alerts {% if notification_count and notification_count > 0 %}<span class="badge bg-danger ms-2">{{ notification_count }}</span>{% endif %}</a>
        <!-- <a href="/password-check">🔐 Password Check</a>-->
        <a href="/logout">🚪 Logout</a>
    {% else %}
        <!-- Public Navigation -->
        <a href="/">🔍 Search</a>
        <!-- <a href="/password-check">🔐 Password Check</a>-->
        <a href="/login">🔐 Login</a>
    {% endif %}
</div>

        <!-- Main Content -->
        <div class="col-lg-10 col-md-9 main">
            {% block content %}{% endblock %}
        </div>

    </div>
</div>

{% block scripts %}{% endblock %}

</body>
</html>
